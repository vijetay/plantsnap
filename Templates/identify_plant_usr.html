{% extends 'base_user.html' %}
{% block content %}

<style>
.identify-bg {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(rgba(255,255,255,0.22), rgba(255,255,255,0.22)),
        url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=2400&q=90");
    background-size: cover;
    background-position: center;
}

.glass-card {
    width: 70%;
    max-width: 1000px;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 40px;
}

.preview-img {
    max-width: 100%;
    border-radius: 15px;
}
</style>

<div class="identify-bg">
<div class="glass-card">

<h3 class="fw-bold text-success text-center mb-4">🌿 Identify Plant</h3>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="hidden" name="action" value="identify">

    <input type="file"
           name="plant_image"
           class="form-control mb-3"
           accept="image/*"
           onchange="previewImage(event)"
           required>

    <img id="imagePreview" class="preview-img mb-3" style="display:none;">

    <button class="btn btn-success btn-lg w-100">
        🔍 Identify Plant
    </button>

    <button type="button" class="btn btn-success btn-lg w-100 mt-2" onclick="window.location.href='{% url 'prev_ident_usr' %}'">
        Previous identifications
    </button>

</form>

{% if common_name %}
<hr>

<div class="row align-items-center mt-4">
     {% if temp_image %}
        <div class="col-md-6 text-center">
            <img src="{{ temp_image.image.url }}" class="preview-img" style="width:60%;height:60%">
        </div>
      {% endif %}

    <div class="col-md-6">
        <div class="card p-4 shadow">
            <p><b>Common Name:</b> {{ common_name }}</p>
            <p><b>Scientific Name:</b> <em>{{ scientific_name }}</em></p>
            <p><b>Confidence:</b> {{ confidence }}%</p>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="hidden" name="action" value="save">

                <input type="hidden" name="temp_id" value="{{ temp_image.id }}">
                <input type="hidden" name="common_name" value="{{ common_name }}">
                <input type="hidden" name="scientific_name" value="{{ scientific_name }}">
                <input type="hidden" name="confidence" value="{{ confidence }}">


                <!-- SAME FILE INPUT -->
                <input type="file" name="plant_image" hidden>

                <button class="btn btn-success w-100 mt-3">
                    💾 Save Image
                </button>
            </form>
        </div>
    </div>
</div>
{% endif %}

</div>
</div>

<script>
function previewImage(event) {
    const img = document.getElementById("imagePreview");
    img.src = URL.createObjectURL(event.target.files[0]);
    img.style.display = "block";

    // Also show in result section if exists
    const resultImg = document.getElementById("imagePreviewResult");
    if (resultImg) {
        resultImg.src = img.src;
    }
}
</script>

{% endblock %}
