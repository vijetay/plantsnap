<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PlantSnap | Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                        url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .dashboard-card {
            max-width: 450px;
            border-radius: 15px;
        }

        .btn-custom {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="card shadow-lg dashboard-card p-4 text-center">
        <h2 class="fw-bold text-success mb-3">
            🌱 PlantSnap
        </h2>

        <p class="text-muted mb-4">
            Identify plant species and predict diseases
        </p>

        <div class="d-grid gap-3">
            <a href="{% url 'login' %}" class="btn btn-success btn-custom">
                Login
            </a>

            <a href="{% url 'register' %}" class="btn btn-outline-success btn-custom">
                Register
            </a>
        </div>
    </div>

{% if messages %}
  {% for message in messages %}
        <script>alert('{{ message }}')</script>
  {% endfor %}
{% endif %}

</body>
</html>
