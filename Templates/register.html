<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration | PlantSnap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
                        url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6");
            background-size: cover;
            background-position: center;
        }

        .register-card {
            max-width: 500px;
            border-radius: 15px;
        }

        .form-control {
            padding: 12px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="card register-card shadow-lg p-4">
        <div class="text-center mb-3">
            <h3 class="fw-bold text-success">🌿 Create Account</h3>
            <p class="text-muted">Join our plant tracker platform</p>
        </div>

        {% if messages %}
          {% for message in messages %}
                <script>{{ message }}</script>
          {% endfor %}
        {% endif %}


        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password1" class="form-control" placeholder="Enter password" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="password2" class="form-control" placeholder="Confirm password" required>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-success btn-lg">
                    Register
                </button>
            </div>

            <div class="text-center">
                <span class="text-muted">Already have an account?</span>
                <a href="{% url 'login' %}" class="text-success fw-semibold">
                    Login
                </a>
            </div>
        </form>
    </div>

</body>
</html>
